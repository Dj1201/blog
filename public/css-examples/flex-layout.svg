<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Flex 布局效果示意图</title>
  <desc id="desc">展示 Flex 横向排列、间距和居中对齐效果</desc>
  <rect width="920" height="460" rx="18" fill="#f8fafc"/>
  <text x="70" y="76" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800">display: flex</text>
  <rect x="70" y="112" width="780" height="190" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="110" y1="207" x2="810" y2="207" stroke="#94a3b8" stroke-dasharray="8 8" stroke-width="2"/>
  <rect x="130" y="158" width="150" height="98" rx="14" fill="#dbeafe" stroke="#2563eb"/>
  <text x="180" y="216" fill="#1d4ed8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">1</text>
  <rect x="385" y="158" width="150" height="98" rx="14" fill="#dcfce7" stroke="#16a34a"/>
  <text x="435" y="216" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">2</text>
  <rect x="640" y="158" width="150" height="98" rx="14" fill="#fef3c7" stroke="#d97706"/>
  <text x="690" y="216" fill="#92400e" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">3</text>
  <text x="96" y="350" fill="#475569" font-family="Consolas, monospace" font-size="20">display: flex; justify-content: space-between; align-items: center;</text>
  <text x="96" y="386" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="18">适合导航栏、按钮组、卡片内部横向排列</text>
</svg>
