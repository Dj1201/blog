<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">CSS 盒模型示意图</title>
  <desc id="desc">展示 margin、border、padding 和 content 的关系</desc>
  <rect width="920" height="520" rx="18" fill="#f8fafc"/>
  <rect x="90" y="70" width="740" height="360" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="118" y="112" fill="#991b1b" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">margin 外边距</text>
  <rect x="160" y="132" width="600" height="250" rx="14" fill="#fed7aa" stroke="#f97316" stroke-width="2"/>
  <text x="188" y="172" fill="#9a3412" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">border 边框</text>
  <rect x="225" y="192" width="470" height="150" rx="12" fill="#fef3c7" stroke="#eab308" stroke-width="2"/>
  <text x="252" y="230" fill="#854d0e" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">padding 内边距</text>
  <rect x="330" y="248" width="260" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="414" y="285" fill="#1d4ed8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">content 内容</text>
  <text x="120" y="472" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="20">元素真实占位 = content + padding + border + margin</text>
</svg>
