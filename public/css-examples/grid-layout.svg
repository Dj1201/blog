<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Grid 布局效果示意图</title>
  <desc id="desc">展示 CSS Grid 三列两行卡片布局</desc>
  <rect width="920" height="520" rx="18" fill="#f8fafc"/>
  <text x="70" y="76" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800">display: grid</text>
  <rect x="70" y="110" width="780" height="290" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <g fill="#eef4ff" stroke="#2563eb">
    <rect x="110" y="145" width="210" height="95" rx="12"/>
    <rect x="355" y="145" width="210" height="95" rx="12"/>
    <rect x="600" y="145" width="210" height="95" rx="12"/>
    <rect x="110" y="270" width="210" height="95" rx="12"/>
    <rect x="355" y="270" width="210" height="95" rx="12"/>
    <rect x="600" y="270" width="210" height="95" rx="12"/>
  </g>
  <g fill="#1d4ed8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">
    <text x="202" y="201">1</text>
    <text x="447" y="201">2</text>
    <text x="692" y="201">3</text>
    <text x="202" y="326">4</text>
    <text x="447" y="326">5</text>
    <text x="692" y="326">6</text>
  </g>
  <text x="96" y="448" fill="#475569" font-family="Consolas, monospace" font-size="20">grid-template-columns: repeat(3, 1fr); gap: 24px;</text>
  <text x="96" y="484" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="18">适合文章列表、商品卡片、后台面板、相册墙</text>
</svg>
